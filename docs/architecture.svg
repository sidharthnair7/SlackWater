<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1110" width="1600" height="1110" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
  <title>SlackWater architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#36464b"/>
    </marker>
    <style>
      .bg { fill: #f6f8f7; }
      .box { fill: #ffffff; stroke: #c7d1d0; stroke-width: 1.5; }
      .engine { fill: #eef4f6; stroke: #0d6a85; stroke-width: 2; }
      .step { fill: #ffffff; stroke: #9fb3b8; stroke-width: 1.2; }
      .gate { fill: #ffffff; stroke: #c7d1d0; stroke-width: 1.2; }
      .dashed { fill: none; stroke: #8a9799; stroke-width: 1.5; stroke-dasharray: 6 5; }
      .h1 { font-size: 30px; font-weight: 700; fill: #111a1c; }
      .sub { font-size: 15px; fill: #5a6a6d; }
      .title { font-size: 18px; font-weight: 700; fill: #111a1c; }
      .label { font-size: 12px; font-weight: 600; letter-spacing: 1.2px; fill: #0d6a85; }
      .t { font-size: 14.5px; fill: #1f2a2d; }
      .m { font-size: 13px; fill: #1f2a2d; font-family: Consolas, 'Cascadia Mono', monospace; }
      .small { font-size: 12.5px; fill: #5a6a6d; }
      .edge { stroke: #36464b; stroke-width: 1.6; fill: none; }
      .edgelabel { font-size: 12px; fill: #36464b; }
      .num { font-size: 13px; font-weight: 700; fill: #0d6a85; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1110"/>

  <!-- Title -->
  <text x="40" y="58" class="h1">SlackWater: how it works</text>
  <text x="40" y="86" class="sub">Engine 0.2.0 · Java 25 · Spring Boot 4.1 · JavaCV (OpenCV 4.14 + FFmpeg 8.1) · H2 · React + TypeScript page (Vite)</text>

  <!-- ===== Row 1 ===== -->
  <!-- A: the page -->
  <rect class="box" x="40" y="120" width="300" height="230" rx="6"/>
  <text x="58" y="148" class="label">BROWSER · REACT + TYPESCRIPT</text>
  <text x="58" y="172" class="title">The page</text>
  <text x="58" y="200" class="t">Measure · Readings · Method</text>
  <text x="58" y="224" class="t">Draw the water box on the clip</text>
  <text x="58" y="248" class="t">Upload your own clip</text>
  <text x="58" y="272" class="t">Live from the engine, or the</text>
  <text x="58" y="292" class="t">saved snapshot when offline</text>
  <text x="58" y="318" class="t">Plays the clip with the</text>
  <text x="58" y="338" class="t">engine's arrows laid on top</text>

  <!-- B: API -->
  <rect class="box" x="440" y="120" width="360" height="230" rx="6"/>
  <text x="458" y="148" class="label">SPRING BOOT · REST API</text>
  <text x="458" y="172" class="title">ReadingController</text>
  <text x="458" y="202" class="m">POST /api/readings</text>
  <text x="458" y="224" class="m">GET  /api/readings</text>
  <text x="458" y="246" class="m">GET  /api/readings/{id}</text>
  <text x="458" y="268" class="m">     …/evidence.png  …/overlay.png</text>
  <text x="458" y="290" class="m">     …/fhir</text>
  <text x="458" y="318" class="m">GET  /clips/**</text>
  <text x="590" y="318" class="small">(ClipFilesConfig, read-only)</text>
  <text x="458" y="340" class="small">Bad water box → 400 with the reason in words</text>

  <!-- C: service -->
  <rect class="box" x="880" y="120" width="310" height="230" rx="6"/>
  <text x="898" y="148" class="label">SERVICE</text>
  <text x="898" y="172" class="title">ReadingService</text>
  <text x="898" y="202" class="num">1</text><text x="916" y="202" class="t">Save the upload to a temp file</text>
  <text x="898" y="228" class="num">2</text><text x="916" y="228" class="t">SHA-256 of the video</text>
  <text x="898" y="254" class="num">3</text><text x="916" y="254" class="t">Run the engine (below)</text>
  <text x="898" y="280" class="num">4</text><text x="916" y="280" class="t">Save the reading</text>
  <text x="898" y="306" class="num">5</text><text x="916" y="306" class="t">Delete the video:</text>
  <text x="916" y="326" class="t">only its fingerprint is kept</text>

  <!-- D: seeding -->
  <rect class="box" x="1270" y="120" width="290" height="230" rx="6"/>
  <text x="1288" y="148" class="label">ON STARTUP</text>
  <text x="1288" y="172" class="title">SeedReadings</text>
  <text x="1288" y="202" class="t">If there are no readings,</text>
  <text x="1288" y="224" class="t">measure every clip listed in</text>
  <text x="1288" y="246" class="m">clips/seed.csv</text>
  <text x="1288" y="274" class="t">The Geul flood video</text>
  <text x="1288" y="294" class="small">Zenodo 15002591 · CC BY 4.0</text>
  <text x="1288" y="322" class="t">So judges always see</text>
  <text x="1288" y="342" class="t">real readings</text>

  <!-- Row 1 edges -->
  <line class="edge" x1="340" y1="200" x2="438" y2="200" marker-end="url(#arrow)"/>
  <text x="352" y="190" class="edgelabel">clip + box</text>
  <line class="edge" x1="440" y1="282" x2="342" y2="282" marker-end="url(#arrow)"/>
  <text x="350" y="300" class="edgelabel">JSON + PNGs</text>
  <line class="edge" x1="800" y1="235" x2="878" y2="235" marker-end="url(#arrow)"/>
  <text x="810" y="225" class="edgelabel">measure</text>
  <line class="edge" x1="1270" y1="235" x2="1192" y2="235" marker-end="url(#arrow)"/>
  <text x="1196" y="225" class="edgelabel">startup</text>
  <line class="edge" x1="1035" y1="350" x2="1035" y2="398" marker-end="url(#arrow)"/>

  <!-- ===== Engine ===== -->
  <rect class="engine" x="40" y="400" width="1520" height="400" rx="8"/>
  <text x="64" y="432" class="label">ENGINE · ca.slackwater.analysis</text>
  <text x="64" y="454" class="title">FlowAnalyzer: still, moving, or refused, and why</text>
  <text x="1536" y="432" class="small" text-anchor="end">Good Features To Track + Kanade-Lucas-Tomasi, the same method family as KLT-IV (Perks, 2020)</text>

  <!-- pipeline steps -->
  <g>
    <rect class="step" x="64" y="472" width="264" height="116" rx="5"/>
    <text x="80" y="496" class="title" font-size="16">1  Read frames</text>
    <text x="80" y="520" class="t">FFmpeg through JavaCV</text>
    <text x="80" y="542" class="t">grey, at most 640 px wide</text>
    <text x="80" y="564" class="t">the video's own timestamps</text>

    <rect class="step" x="362" y="472" width="264" height="116" rx="5"/>
    <text x="378" y="496" class="title" font-size="16">2  Pair frames</text>
    <text x="378" y="520" class="t">about 0.1 s apart</text>
    <text x="378" y="542" class="t">(every 3rd frame at 30 fps)</text>

    <rect class="step" x="660" y="472" width="264" height="116" rx="5"/>
    <text x="676" y="496" class="title" font-size="16">3  Find points</text>
    <text x="676" y="520" class="t">corners: foam, leaves, ripples</text>
    <text x="676" y="542" class="t">inside the water box, and</text>
    <text x="676" y="564" class="t">on the banks outside it</text>

    <rect class="step" x="958" y="472" width="264" height="116" rx="5"/>
    <text x="974" y="496" class="title" font-size="16">4  Follow each point</text>
    <text x="974" y="520" class="t">Lucas-Kanade optical flow,</text>
    <text x="974" y="542" class="t">then back again; drop it if</text>
    <text x="974" y="564" class="t">it misses home by &gt; 0.5 px</text>

    <rect class="step" x="1256" y="472" width="264" height="116" rx="5"/>
    <text x="1272" y="496" class="title" font-size="16">5  Check the camera</text>
    <text x="1272" y="520" class="t">the banks shouldn't move:</text>
    <text x="1272" y="542" class="t">&gt; 0.8 px drops that pair,</text>
    <text x="1272" y="564" class="t">smaller shifts are subtracted</text>

    <line class="edge" x1="328" y1="530" x2="360" y2="530" marker-end="url(#arrow)"/>
    <line class="edge" x1="626" y1="530" x2="658" y2="530" marker-end="url(#arrow)"/>
    <line class="edge" x1="924" y1="530" x2="956" y2="530" marker-end="url(#arrow)"/>
    <line class="edge" x1="1222" y1="530" x2="1254" y2="530" marker-end="url(#arrow)"/>
  </g>

  <!-- gates -->
  <text x="200" y="622" class="t" font-weight="600">Gates, in order, 1 to 6. The first one that fails becomes the refusal, in plain words.</text>
  <g>
    <rect class="gate" x="64" y="630" width="226" height="64" rx="5"/>
    <text x="78" y="656" class="t" font-weight="600">1  Enough video</text>
    <text x="78" y="680" class="small">≥ 1 s and ≥ 5 pairs</text>

    <rect class="gate" x="306" y="630" width="226" height="64" rx="5"/>
    <text x="320" y="656" class="t" font-weight="600">2  Banks in view</text>
    <text x="320" y="680" class="small">≥ 12 bank points</text>

    <rect class="gate" x="548" y="630" width="226" height="64" rx="5"/>
    <text x="562" y="656" class="t" font-weight="600">3  Camera held still</text>
    <text x="562" y="680" class="small">≤ 25% of pairs moved</text>

    <rect class="gate" x="790" y="630" width="226" height="64" rx="5"/>
    <text x="804" y="656" class="t" font-weight="600">4  Background still</text>
    <text x="804" y="680" class="small">bank jitter ≤ 15 px/s</text>

    <rect class="gate" x="1032" y="630" width="226" height="64" rx="5"/>
    <text x="1046" y="656" class="t" font-weight="600">5  Something to follow</text>
    <text x="1046" y="680" class="small">≥ 15 water points</text>

    <rect class="gate" x="1274" y="630" width="246" height="64" rx="5"/>
    <text x="1288" y="656" class="t" font-weight="600">6  One direction</text>
    <text x="1288" y="680" class="small">coherence ≥ 0.60 (if moving)</text>
  </g>
  <path class="edge" d="M1388 588 V600 H177 V628" marker-end="url(#arrow)"/>

  <!-- verdicts -->
  <g>
    <rect x="64" y="718" width="300" height="62" rx="5" fill="#eef5e6" stroke="#4a6e1f" stroke-width="1.5"/>
    <text x="80" y="744" class="t" font-weight="700" fill="#4a6e1f">STILL</text>
    <text x="80" y="766" class="small">points were seen, and stayed put</text>

    <rect x="380" y="718" width="420" height="62" rx="5" fill="#e6f1f5" stroke="#0d6a85" stroke-width="1.5"/>
    <text x="396" y="744" class="t" font-weight="700" fill="#0d6a85">MOVING</text>
    <text x="396" y="766" class="small">surface speed, direction; m/s only with a scale</text>

    <rect x="816" y="718" width="330" height="62" rx="5" fill="#f8efe1" stroke="#985800" stroke-width="1.5"/>
    <text x="832" y="744" class="t" font-weight="700" fill="#985800">REFUSED</text>
    <text x="832" y="766" class="small">which gate failed, and what to do</text>

    <rect class="step" x="1162" y="718" width="358" height="62" rx="5"/>
    <text x="1178" y="744" class="t" font-weight="600">Evidence</text>
    <text x="1178" y="766" class="small">a real frame with the arrows, plus an overlay</text>
  </g>
  <line class="edge" x1="590" y1="694" x2="590" y2="716" marker-end="url(#arrow)"/>
  <text x="600" y="711" class="edgelabel">verdict</text>

  <!-- ===== Row 3 ===== -->
  <line class="edge" x1="214" y1="800" x2="214" y2="848" marker-end="url(#arrow)"/>
  <text x="224" y="830" class="edgelabel">saved as a Reading</text>

  <rect class="box" x="40" y="850" width="360" height="190" rx="6"/>
  <text x="58" y="878" class="label">RECORD · JPA → H2 (IN MEMORY)</text>
  <text x="58" y="902" class="title">Reading</text>
  <text x="58" y="930" class="t">verdict, reason, speed, direction</text>
  <text x="58" y="952" class="t">all 14 gate values</text>
  <text x="58" y="978" class="t">fingerprint = SHA-256 of the video</text>
  <text x="58" y="998" class="t">hash + settings + engine version</text>
  <text x="58" y="1024" class="t">evidence PNG + overlay PNG</text>

  <rect class="box" x="440" y="850" width="330" height="190" rx="6"/>
  <text x="458" y="878" class="label">THE CITIZEN APP'S WORDS</text>
  <text x="458" y="902" class="title">AppFlowAnswer</text>
  <text x="458" y="930" class="t">STILL → STA Stagnant/intermittent</text>
  <text x="458" y="952" class="t">MOVING ≥ 0.5 m/s → FAS Fast</text>
  <text x="458" y="974" class="t">MOVING &lt; 0.5 m/s → NOR Slow</text>
  <text x="458" y="996" class="t">no scale or refused → no answer</text>
  <text x="458" y="1024" class="small">0.5 m/s is our stated assumption</text>

  <rect class="box" x="810" y="850" width="360" height="190" rx="6"/>
  <text x="828" y="878" class="label">INTEROPERABILITY · FHIR R4</text>
  <text x="828" y="902" class="title">FhirObservation</text>
  <text x="828" y="930" class="t">OneAquaHealth profile</text>
  <text x="828" y="950" class="m">observation-indicators-oah</text>
  <text x="828" y="976" class="t">code #hydrology · a Location</text>
  <text x="828" y="998" class="t">m/s in UCUM; a refusal becomes</text>
  <text x="828" y="1020" class="t">dataAbsentReason + the reason</text>

  <rect class="box" x="1210" y="850" width="350" height="190" rx="6"/>
  <text x="1228" y="878" class="label">WHERE IT GOES</text>
  <text x="1228" y="902" class="title">Results</text>
  <text x="1228" y="930" class="t">the page: readout, Readings</text>
  <text x="1228" y="952" class="t">FHIR for OneAquaHealth systems</text>
  <text x="1228" y="978" class="t">Scorer: labelled clips →</text>
  <text x="1228" y="998" class="m">clips/score.md</text>
  <rect class="dashed" x="1222" y="1006" width="326" height="26" rx="4"/>
  <text x="1232" y="1024" class="small">not built yet: sandbox POST, live deploy</text>

  <line class="edge" x1="400" y1="945" x2="438" y2="945" marker-end="url(#arrow)"/>
  <line class="edge" x1="770" y1="945" x2="808" y2="945" marker-end="url(#arrow)"/>
  <line class="edge" x1="1170" y1="945" x2="1208" y2="945" marker-end="url(#arrow)"/>

  <!-- footer -->
  <text x="40" y="1080" class="small">Solid: built and tested (28 tests, plus the scorer waiting for labels). Dashed: not built yet. Ships as one Docker image with Linux native libraries and the seed clips (Dockerfile written, not yet built).</text>
</svg>
